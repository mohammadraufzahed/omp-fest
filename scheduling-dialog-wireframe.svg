  <g id="annotation.rail" font-family="monospace" fill="#34445E">
    <line x1="1762" y1="64" x2="1762" y2="1408" stroke="#D9DEEA" stroke-width="1.5"/>
    <text x="1780" y="73" font-size="17" font-weight="bold" fill="#6C4DDB">COMPONENT / STYLE INVENTORY</text>
    <text x="1780" y="96" font-size="12">One static image; source text represented by bars.</text>
    <line x1="1780" y1="111" x2="2168" y2="111" stroke="#E2E6EE"/>

    <text x="1780" y="138" font-size="15" fill="#6C4DDB">01  DIALOG CHROME</text>
    <text x="1780" y="160" font-size="13">dialog.root: white, 1.8px cool-gray edge, r32</text>
    <text x="1780" y="181" font-size="13">title: 246x34 blue bar + 30px status dot</text>
    <text x="1780" y="202" font-size="13">close: 22px crossed strokes, muted gray</text>
    <line x1="1780" y1="217" x2="2168" y2="217" stroke="#E2E6EE"/>

    <text x="1780" y="243" font-size="15" fill="#6C4DDB">02  WARNING BANNER</text>
    <text x="1780" y="265" font-size="13">1554x140; pale amber surface; 12px radius</text>
    <text x="1780" y="286" font-size="13">30px amber icon; heading + one long text line</text>
    <text x="1780" y="307" font-size="13">Warning reports 2 people in a named status.</text>
    <line x1="1780" y1="322" x2="2168" y2="322" stroke="#E2E6EE"/>

    <text x="1780" y="348" font-size="15" fill="#6C4DDB">03  RECIPIENT LIST</text>
    <text x="1780" y="370" font-size="13">1545x520; pale 84px header; 10 selected total</text>
    <text x="1780" y="391" font-size="13">3 rows visible; scrollbar at the left edge</text>
    <text x="1780" y="412" font-size="13">Each: name + phone label/value, avatar, check</text>
    <text x="1780" y="433" font-size="13">Row about 1390x93; visible gaps about 40/29px</text>
    <text x="1780" y="454" font-size="13">Avatar 50px; checked control 36px; row radius 13</text>
    <line x1="1780" y1="469" x2="2168" y2="469" stroke="#E2E6EE"/>

    <text x="1780" y="495" font-size="15" fill="#6C4DDB">04  OBSERVED ROW STATES</text>
    <g id="variant.recipient.standard-selected">
      <rect x="1780" y="511" width="180" height="52" rx="8" fill="#F4F5FB" stroke="#DFE3EB" stroke-width="1.5"/>
      <rect x="1792" y="532" width="56" height="7" rx="2" fill="#444444"/>
      <rect x="1855" y="532" width="30" height="6" rx="2" fill="#85888D"/>
      <circle cx="1912" cy="537" r="11" fill="#D7DFEF"/>
      <path d="M1906 541c1-4 3-6 6-6s5 2 6 6" fill="#FFFFFF"/>
      <rect x="1932" y="526" width="21" height="21" rx="2" fill="#36479A"/>
      <path d="M1937 537l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1780" y="582" font-size="12">standard selected</text>
    </g>
    <g id="variant.recipient.warning-selected">
      <rect x="1981" y="511" width="187" height="52" rx="8" fill="#FFFCF8" stroke="#C96A18" stroke-width="2"/>
      <rect x="1992" y="532" width="53" height="7" rx="2" fill="#444444"/>
      <rect x="2051" y="532" width="28" height="6" rx="2" fill="#85888D"/>
      <circle cx="2104" cy="537" r="11" fill="#D7DFEF"/>
      <path d="M2098 541c1-4 3-6 6-6s5 2 6 6" fill="#FFFFFF"/>
      <rect x="2125" y="526" width="21" height="21" rx="2" fill="#C96A18"/>
      <path d="M2130 537l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1981" y="582" font-size="12">amber selected</text>
    </g>
    <text x="1780" y="605" font-size="12">Same row anatomy; only the caution styling changes.</text>
    <line x1="1780" y1="620" x2="2168" y2="620" stroke="#E2E6EE"/>

    <text x="1780" y="646" font-size="15" fill="#6C4DDB">05  DATE RANGE + ACTIONS</text>
    <text x="1780" y="668" font-size="13">Date block 1546x314; two filled fields ~470x83</text>
    <text x="1780" y="689" font-size="13">White fields; 2px blue-gray edge; 7px radius</text>
    <text x="1780" y="710" font-size="13">Calendar icons 26px; values are dark text bars</text>
    <text x="1780" y="731" font-size="13">Helper line violet; info ring 32px</text>
    <text x="1780" y="752" font-size="13">Primary 267x81 filled; secondary 269x81 outlined</text>
    <line x1="1780" y1="767" x2="2168" y2="767" stroke="#E2E6EE"/>

    <text x="1780" y="793" font-size="15" fill="#6C4DDB">06  STATE / MOTION COVERAGE</text>
    <text x="1780" y="815" font-size="13">Observed: checked rows, amber row, filled dates,</text>
    <text x="1780" y="836" font-size="13">warning visible, primary and secondary enabled.</text>
    <text x="1780" y="857" font-size="13">Not shown: hover, focus, pressed, picker-open,</text>
    <text x="1780" y="878" font-size="13">loading, or any time-based transition.</text>
    <g id="motion.evidence.track">
      <rect x="1780" y="894" width="118" height="38" rx="5" fill="#F4F5FB" stroke="#B9C6D8" stroke-width="1.3"/>
      <rect x="1792" y="909" width="54" height="8" rx="2" fill="#444444"/>
      <text x="1854" y="918" font-size="11">frame A</text>
      <line x1="1905" y1="913" x2="1940" y2="913" stroke="#6C4DDB" stroke-width="2"/>
      <path d="M1940 913l-8-5v10z" fill="#6C4DDB"/>
      <rect x="1950" y="894" width="218" height="38" rx="5" fill="#FFFFFF" stroke="#B9C6D8" stroke-width="1.3" stroke-dasharray="5 4"/>
      <text x="1963" y="918" font-size="11" fill="#85888D">next frame not supplied</text>
    </g>
    <text x="1780" y="953" font-size="12">Timing/easing: unknown; no motion inferred from a still.</text>
    <line x1="1780" y1="968" x2="2168" y2="968" stroke="#E2E6EE"/>

    <text x="1780" y="994" font-size="15" fill="#6C4DDB">07  EXTRACTED STYLE TOKENS</text>
    <rect x="1780" y="1008" width="18" height="14" fill="#FFFFFF" stroke="#B9C6D8"/>
    <text x="1808" y="1020" font-size="12">dialog surface #FFFFFF</text>
    <rect x="1780" y="1030" width="18" height="14" fill="#F4F5FB" stroke="#DFE3EB"/>
    <text x="1808" y="1042" font-size="12">row surface #F4F5FB</text>
    <rect x="1780" y="1052" width="18" height="14" fill="#B9C6D8"/>
    <text x="1808" y="1064" font-size="12">container edge #B9C6D8</text>
    <rect x="1780" y="1074" width="18" height="14" fill="#444444"/>
    <text x="1808" y="1086" font-size="12">primary text bar #444444</text>
    <rect x="1780" y="1096" width="18" height="14" fill="#85888D"/>
    <text x="1808" y="1108" font-size="12">secondary label #85888D</text>
    <rect x="1780" y="1118" width="18" height="14" fill="#36479A"/>
    <text x="1808" y="1130" font-size="12">selected/action #36479A</text>
    <rect x="1780" y="1140" width="18" height="14" fill="#C96A18"/>
    <text x="1808" y="1152" font-size="12">warning/exception #C96A18</text>
    <rect x="1780" y="1162" width="18" height="14" fill="#6C4DDB"/>
    <text x="1808" y="1174" font-size="12">helper/callout #6C4DDB</text>
    <line x1="1780" y1="1190" x2="2168" y2="1190" stroke="#E2E6EE"/>

    <text x="1780" y="1216" font-size="15" fill="#6C4DDB">08  COMPONENT STYLE NOTES</text>
    <text x="1780" y="1238" font-size="12">Rows: radius 13; 1.5px border; body bars #444.</text>
    <text x="1780" y="1258" font-size="12">Labels #858; values darker/bolder by bar weight.</text>
    <text x="1780" y="1278" font-size="12">Avatar: 50px circle, pale blue ground, white bust.</text>
    <text x="1780" y="1298" font-size="12">Checks: 36px square, 3px radius, 4px white tick.</text>
    <text x="1780" y="1318" font-size="12">Buttons: 14px radius; filled vs outlined hierarchy.</text>
    <text x="1780" y="1338" font-size="12">All original-language UI copy is intentionally omitted.</text>
    <text x="1780" y="1370" font-size="11" fill="#66738B">Colors and radii are visual estimates from the image.</text>
  </g>

  <g id="spacing-ledger" font-family="monospace" fill="#34445E">
    <line x1="24" y1="1456" x2="2168" y2="1456" stroke="#BFC9D8" stroke-width="1.4"/>
    <text x="30" y="1486" font-size="17" font-weight="bold" fill="#6C4DDB">SECTION GUTTERS - SOURCE PIXELS</text>
    <text x="30" y="1515" font-size="14">Warning banner to recipients list</text><text x="535" y="1515" font-size="14">~32 px</text>
    <text x="30" y="1541" font-size="14">Recipients list to date-range block</text><text x="535" y="1541" font-size="14">~33 px</text>
    <text x="30" y="1567" font-size="14">Date-range block to footer actions</text><text x="535" y="1567" font-size="14">~32 px</text>
    <text x="30" y="1593" font-size="14">Dialog inset from source frame</text><text x="535" y="1593" font-size="14">x~40 / y~32 px</text>
    <text x="30" y="1619" font-size="14">Main dialog bounds (source)</text><text x="535" y="1619" font-size="14">~1646 x 1296 px</text>

    <line x1="760" y1="1480" x2="760" y2="1636" stroke="#D9DEEA"/>
    <text x="800" y="1486" font-size="17" font-weight="bold" fill="#6C4DDB">COMPONENT GEOMETRY - SOURCE PIXELS</text>
    <text x="800" y="1515" font-size="14">Recipient panel ~1545 x 520; header ~84px high</text>
    <text x="800" y="1541" font-size="14">Row card ~1390 x 93; row gaps ~40px and ~29px</text>
    <text x="800" y="1567" font-size="14">Date block ~1546 x 314; each field ~470 x 83</text>
    <text x="800" y="1593" font-size="14">Primary button ~267 x 81; secondary ~269 x 81</text>
    <text x="800" y="1619" font-size="14">One still only: no hover, transition, duration or easing data.</text>
  </g>
</svg>
