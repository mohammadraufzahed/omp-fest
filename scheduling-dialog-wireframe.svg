<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2192 1680">
  <title>Scheduling dialog - component, style, and state wireframe</title>
  <desc>Low-fidelity annotated reconstruction of the supplied scheduling modal. The UI uses role-sized bars instead of Persian glyphs. The SVG includes the observed selected-row variants, component style tokens, layout measurements, and explicit unknown motion states. Source image: 1722 by 1376 pixels, displayed at 1568 by 1253 pixels.</desc>
